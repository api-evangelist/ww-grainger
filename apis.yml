description: >-
  W. W. Grainger, Inc. (NYSE: GWW) is a Fortune 500 broad-line distributor of maintenance,
  repair and operating (MRO) products serving businesses and institutions across North America,
  Japan and the United Kingdom through roughly 331 branches, 34 distribution centers and its
  digital channels. Its system-to-system commerce runs through eProcurement rather than a public
  developer program: PunchOut catalogs into Ariba, Coupa, Jaggaer, SAP, Oracle and GHX, ANSI ASC
  X12 4010 EDI for purchase orders, acknowledgments, ship notices and invoices, and the KeepStock
  inventory-management program. Grainger operates an API gateway at api.grainger.com, but its
  Swagger surface answers anonymous callers with an ACCESS DENIED page requiring the Grainger
  corporate network, and integration credentials are issued only by a Grainger account
  representative, so no public API contract or reference is available to evaluate.
